name: Deploy MyProf AI API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

concurrency:
  group: myprof-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish private API
    runs-on: ubuntu-latest
    steps:
      - name: Check whether deployment is configured
        id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment is not activated. Add the CLOUDFLARE_API_TOKEN repository secret."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out MyProf
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        if: steps.config.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 742e66c3463fcc71387b96c322c041b0
          workingDirectory: worker
          command: deploy

      - name: Confirm the health endpoint
        if: steps.config.outputs.enabled == 'true'
        run: |
          node - <<'NODE'
          (async () => {
            const response = await fetch("https://myprof-ai-api.quraaty.workers.dev/api/health");
            if (!response.ok) throw new Error("Health check HTTP " + response.status);
            const body = await response.json();
            if (body.success !== true || body.status !== "running") {
              throw new Error("Health check returned unexpected output");
            }
            console.log("MyProf AI API responds successfully.");
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
